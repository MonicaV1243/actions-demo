name: Test Mac Self Hosted runner

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  mobilewright-test:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      
      - name: Install dependencies
        run: npm ci
      
      - name: Check Mobilewright environment
        run: npx mobilewright doctor --category ios

      - name: Run Mobilewright tests
        run: npx mobilewright test
